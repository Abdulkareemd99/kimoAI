<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KimoAI Sign Up | Start Creating AI Videos</title>
    <meta
      name="description"
      content="Create your KimoAI account and start turning ideas into stunning AI videos."
    />
    <meta property="og:title" content="Sign Up to KimoAI" />
    <meta property="og:description" content="Join KimoAI and create professional AI-powered videos." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header" aria-label="Main header">
      <div class="container nav-wrap">
        <a href="index.html#home" class="logo" aria-label="KimoAI home">
          <span class="logo-mark" aria-hidden="true"></span>
          KimoAI
        </a>

        <button class="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
          <span></span>
        </button>

        <nav class="nav-menu" aria-label="Main navigation">
          <a href="index.html#home">Home</a>
          <a href="index.html#generator">AI Video Generator</a>
          <a href="index.html#features">Features</a>
          <a href="index.html#how-it-works">How It Works</a>
          <a href="pricing.html">Pricing</a>
          <a href="index.html#examples">Examples</a>
          <a href="index.html#faq">FAQ</a>
        </nav>

        <div class="nav-ctas">
          <a class="btn btn-secondary btn-small" href="login.html">Log In</a>
          <a class="btn btn-primary btn-small" href="signup.html">Sign Up Free</a>
        </div>
      </div>
    </header>

    <main class="auth-wrap">
      <section class="auth-card reveal" aria-label="Sign up form section">
        <span class="badge">Create Account</span>
        <h1>Start creating with KimoAI</h1>
        <p class="section-copy">Build your first AI video workflow in minutes.</p>

        <form id="signup-form" class="form-grid" novalidate>
          <div class="field">
            <label for="fullName">Full Name</label>
            <input id="fullName" type="text" autocomplete="name" required />
            <div id="fullNameError" class="field-error" aria-live="polite"></div>
          </div>

          <div class="field">
            <label for="signupEmail">Email Address</label>
            <input id="signupEmail" type="email" autocomplete="email" required />
            <div id="signupEmailError" class="field-error" aria-live="polite"></div>
          </div>

          <div class="field">
            <label for="signupPassword">Password</label>
            <div class="input-group">
              <input id="signupPassword" type="password" autocomplete="new-password" required />
              <button class="toggle-password" type="button" data-target="#signupPassword">Show</button>
            </div>
            <div id="signupPasswordError" class="field-error" aria-live="polite"></div>
          </div>

          <div class="field">
            <label for="confirmPassword">Confirm Password</label>
            <div class="input-group">
              <input id="confirmPassword" type="password" autocomplete="new-password" required />
              <button class="toggle-password" type="button" data-target="#confirmPassword">Show</button>
            </div>
            <div id="confirmPasswordError" class="field-error" aria-live="polite"></div>
          </div>

          <label class="checkbox" for="agreeTerms">
            <input id="agreeTerms" type="checkbox" />
            I agree to the Terms of Service and Privacy Policy.
          </label>
          <div id="agreeTermsError" class="field-error" aria-live="polite"></div>

          <button class="btn btn-primary btn-large" type="submit">Create Account</button>
        </form>

        <p class="small-note">Already have an account? <a href="login.html">Log In</a></p>
        <p class="small-note">
          We use Supabase Auth for secure sign-up and email verification.
        </p>
      </section>
    </main>

    <script>
      window.KIMOAI_SUPABASE_CONFIG = window.KIMOAI_SUPABASE_CONFIG || {};
      window.KIMOAI_SUPABASE_CONFIG.url = "https://qiwkksmtmffdojrwrjwz.supabase.co";
      window.KIMOAI_SUPABASE_CONFIG.anonKey = "PASTE_YOUR_SUPABASE_ANON_OR_PUBLISHABLE_KEY_HERE";
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase.js"></script>
    <script src="script.js"></script>
  </body>
</html>
